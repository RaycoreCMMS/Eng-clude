<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دورهٔ مهندسی لیزر فایبر فلزات</title>
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#14212E;--muted:#5A6978;--line:#D5DBE2;--accent:#C2410C;--steel:#2F4B66;--hl:#FFF1E8;--recap:#14212E;--recap-ink:#EAF0F5;--recap-acc:#F2C14E;--beam:#E8590C;--fs:16px;color-scheme:light}
:root[data-theme="dark"]{--bg:#0E1620;--surface:#16222F;--ink:#E7EDF3;--muted:#9DB0C2;--line:#2A3A4A;--accent:#FF8A4C;--steel:#8FB3D6;--hl:#2A1E17;--recap:#0A1118;--recap-ink:#E7EDF3;--recap-acc:#F2C14E;--beam:#FF8A4C;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#0E1620;--surface:#16222F;--ink:#E7EDF3;--muted:#9DB0C2;--line:#2A3A4A;--accent:#FF8A4C;--steel:#8FB3D6;--hl:#2A1E17;--recap:#0A1118;--recap-ink:#E7EDF3;--recap-acc:#F2C14E;--beam:#FF8A4C;color-scheme:dark}}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.9;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:6px;z-index:50}
.skip:focus{top:8px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:700;font-size:1.15rem;line-height:1.5;color:var(--ink);text-decoration:none;display:block}
.brand small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem;line-height:1.6}
.nav a:hover{background:var(--bg)}
.nav a[aria-current="page"]{background:var(--hl);font-weight:700;box-shadow:inset -3px 0 0 var(--accent)}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:inline-grid;place-items:center;font-size:.7rem;color:transparent}
.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--beam);width:0;transition:width .3s}
.searchbox{display:flex;flex-direction:column;gap:6px}
.searchbox input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tools{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.tools button{padding:6px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.topbar{display:none}
main{padding:32px clamp(16px,4vw,48px) 80px;max-width:900px;width:100%}
.beam{display:block;width:100%;height:auto;margin:0 0 8px}
.beam path,.beam line,.beam ellipse{stroke:var(--beam);fill:none;stroke-width:2}
.beam .fill{fill:var(--beam);opacity:.14;stroke:none}
.beam circle{fill:var(--beam)}
.eyebrow{color:var(--muted);font-size:.9rem;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.5;margin:.1em 0 .2em}
.sub{color:var(--muted);font-size:1.1rem;margin:0 0 20px}
.blk{margin:36px 0;padding-top:20px;border-top:1px solid var(--line)}
.blk h2{font-size:1.35rem;margin:0 0 12px;line-height:1.6}
.intro{color:var(--muted);margin:0 0 12px}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 28px}
.term{padding-top:10px;border-top:3px solid var(--steel)}
.term.hl{background:var(--hl);border-top-color:var(--accent);padding:12px 14px;border-radius:0 0 8px 8px}
.term h3{margin:0 0 4px;font-size:1.1rem;line-height:1.6;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.term .pr{color:var(--muted);font-weight:400;font-size:.9rem}
.term p{margin:0 0 4px}
.term ul{margin:0;padding-inline-start:20px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.8}
th{background:var(--steel);color:#fff;font-weight:700;position:sticky;top:0}
:root[data-theme="dark"] th{color:#0E1620}
@media (prefers-color-scheme:dark){:root[data-theme="auto"] th{color:#0E1620}}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
td[dir=ltr]{text-align:right}
.note{margin:12px 0 0;font-weight:700;color:var(--steel)}
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
ol.steps li::before{content:counter(s,persian);flex:none;min-width:2em;text-align:center;font-weight:700;color:var(--accent);font-size:1.2rem}
.formula{background:var(--recap);color:var(--recap-ink);border-radius:12px;padding:20px;text-align:center;margin-bottom:14px}
.formula .eq{font-size:clamp(1.1rem,3.4vw,1.6rem);font-weight:700;color:var(--recap-acc);direction:ltr;unicode-bidi:isolate}
.formula .fa{margin-top:6px}
.recap{background:var(--recap);color:var(--recap-ink);border-radius:12px;padding:18px 20px}
.recap ol{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:8px;font-weight:700}
.recap ::marker{color:var(--recap-acc)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:700}
.q button,.btn{margin-top:8px;padding:7px 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;cursor:pointer;font-weight:700}
.q button:hover,.btn:hover{background:var(--accent);color:#fff}
:root[data-theme="dark"] .q button:hover,:root[data-theme="dark"] .btn:hover{color:#0E1620}
.ans{margin-top:10px;padding:10px 14px;background:var(--hl);border-inline-start:4px solid var(--accent);border-radius:6px}
.btn.solid{background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.solid{color:#0E1620}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;flex-wrap:wrap}
.pager a,.pager button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.pager a:hover{border-color:var(--accent)}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:12px 0}
.plan div{border-inline-start:3px solid var(--steel);padding:2px 12px}
.plan b{display:block}
.lessons{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.lessons li a{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lessons li a:hover{color:var(--accent)}
.lessons .wk{color:var(--muted);min-width:5.5em;font-size:.9rem}
.results a{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.results a:hover{color:var(--accent)}
.results small{color:var(--muted);display:block}
mark{background:var(--hl);color:var(--ink);padding:0 2px;border-bottom:2px solid var(--accent)}
.filter{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:8px 0 16px}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(320px,86vw);z-index:40;transform:translateX(100%);transition:transform .25s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
 body.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
 .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:30}
 .topbar button{padding:6px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
 .topbar strong{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.topbar,.pager,.q button,.tools{display:none!important}.app{display:block}body{background:#fff;color:#000}.ans[hidden]{display:block!important}}
</style>
</head>
<body>
<a class="skip" href="#main">رفتن به محتوا</a>
<div class="topbar"><button id="menuBtn" aria-label="باز کردن منو" aria-expanded="false">منو</button><strong>دورهٔ لیزر فایبر</strong></div>
<div class="app">
 <aside class="side" id="side" aria-label="فهرست دوره">
  <a class="brand" href="#/home">دورهٔ مهندسی لیزر فایبر فلزات<small>هشت درس، کاملاً آفلاین</small></a>
  <div class="searchbox"><label for="q" class="eyebrow">جست‌وجو در همهٔ درس‌ها</label><input id="q" type="search" placeholder="مثلاً: M2 یا نازل" autocomplete="off"></div>
  <div><div class="meter" role="progressbar" aria-label="پیشرفت دوره" aria-valuemin="0" aria-valuemax="8" id="meterbar"><i id="meter"></i></div><p class="eyebrow" id="meterText" style="margin:4px 0 0"></p></div>
  <ul class="nav" id="nav"></ul>
  <div class="tools"><button id="themeBtn">حالت شب/روز</button><button id="fontUp" aria-label="بزرگ‌تر کردن متن">A+</button><button id="fontDown" aria-label="کوچک‌تر کردن متن">A−</button></div>
 </aside>
 <main id="main" tabindex="-1"></main>
</div>
<script>
const DATA={"lessons":[{"short":"فیزیک نور و اصول لیزر","title":"درس ۱: فیزیک نور و اصول لیزر","slides":[{"t":"title","title":"درس ۱: فیزیک نور و اصول لیزر","sub":"دورهٔ مهندسی لیزر فایبر فلزات"},{"t":"cards","title":"چهار ایدهٔ ساده برای شروع","cards":[{"h":"لیزر یعنی نور منظم","b":"مثل سربازانی که هم‌جهت و کنار هم راه می‌روند، نه جمعیتی پراکنده"},{"h":"پمپاژ (Pumping)","b":"به یک ماده انرژی می‌دهیم تا پرانرژی شود و نور منظم پس بدهد"},{"h":"رفت‌وبرگشت بین دو آینه","b":"نور بین دو آینه می‌رود و می‌آید تا قوی‌تر شود"},{"h":"تمرکز مهم‌تر از توان است","b":"مثل ذره‌بین که نور را جمع می‌کند و کاغذ را می‌سوزاند"}]},{"t":"table","title":"نور چیست؟","head":["اصطلاح","تلفظ","معنی"],"widths":[2.4,2.2,4.4],"rows":[["Photon","فُتُن","ذرهٔ نور؛ نور از فوتون‌ها ساخته شده است"],["Wavelength","وِیولِنگث","طول موج (λ): فاصلهٔ دو قلهٔ موج، با واحد نانومتر (nm)"],["Frequency","فِریکوِنسی","بسامد (f): تعداد نوسان موج در یک ثانیه"],["Photon Energy","فُتُن اِنرجی","انرژی فوتون (E): هرچه طول موج کوتاه‌تر، انرژی بیشتر"]],"note":"E = h·c / λ  (h ثابت پلانک، c سرعت نور)"},{"t":"cards","title":"طیف نور و جایگاه لیزر فایبر","cards":[{"h":"UV","p":"یو‌وی","b":"ماورابنفش: زیر ۴۰۰ nm"},{"h":"Visible","p":"ویزیبل","b":"نور مرئی: ۴۰۰ تا ۷۰۰ nm"},{"h":"IR","p":"آی‌آر","b":"فروسرخ: بالای ۷۰۰ nm"},{"h":"لیزر فایبر: ۱۰۷۰ nm","p":"Near-Infrared (نیر اینفرارد)","b":"در ناحیهٔ فروسرخ است و با چشم دیده نمی‌شود؛ به همین دلیل خطرناک است","hl":true}]},{"t":"list","title":"چرا فایبر برای فلز بهتر از CO₂ است؟","items":[["CO₂ (سی‌اُ‌تو):","طول موج ۱۰٬۶۰۰ nm"],["فایبر:","طول موج ۱۰۷۰ nm"],"فلزات نور ۱۰۷۰ nm را خیلی بیشتر جذب می‌کنند","نتیجه: برش سریع‌تر، بازده بالاتر و امکان برش مس و برنج"]},{"t":"cards","title":"سه فرایند پایه در اتم","intro":"حالت پایه (Ground State – گِراند استیت) و حالت برانگیخته (Excited State – اکسایتد استیت)","cols":3,"cards":[{"h":"Absorption","p":"اَبزورپشن","b":"جذب: اتم فوتون می‌گیرد و برانگیخته می‌شود"},{"h":"Spontaneous Emission","p":"اسپانتینیِس ایمیشن","b":"تابش خودبه‌خودی: اتم خودش و تصادفی فوتون می‌دهد؛ مثل نور لامپ"},{"h":"Stimulated Emission","p":"استیمیولیتد ایمیشن","b":"تابش القایی: فوتون دوم دقیقاً مشابه تولید می‌شود؛ قلب لیزر","hl":true}]},{"t":"cards","title":"چهار شرط ساخت لیزر","cards":[{"h":"Gain Medium","p":"گِین مدیوم","b":"محیط تقویت‌کننده؛ در فایبر: ایتربیوم"},{"h":"Pumping","p":"پامپینگ","b":"پمپاژ: تزریق انرژی با دیود لیزر"},{"h":"Population Inversion","p":"پاپیولِیشن اینورژن","b":"وارونی جمعیت: اتم‌های برانگیخته بیشتر از اتم‌های حالت پایه شوند"},{"h":"Resonator","p":"رِزوناتور","b":"کاواک تشدید: دو بازتاب‌دهنده؛ در فایبر همان FBG است"}]},{"t":"table","title":"ویژگی‌های نور لیزر","head":["اصطلاح","تلفظ","معنی"],"widths":[2.6,2.4,4],"rows":[["Monochromatic","مونوکروماتیک","تک‌رنگ: تقریباً فقط یک طول موج"],["Coherent","کوهیرِنت","همدوس: موج‌ها هم‌فاز هستند"],["Collimated","کالیمیتد","موازی: پرتو پخش نمی‌شود"],["High Intensity","های اینتِنسیتی","شدت بالا: روی نقطه‌ای بسیار کوچک جمع می‌شود"]]},{"t":"formula","title":"چگالی توان: مهم‌ترین عدد برش","formula":"Power Density = Power ÷ Spot Area","sub":"چگالی توان = توان ÷ مساحت لکهٔ کانونی (W/cm²)","items":[["مثال:","لیزر ۳ کیلووات با لکهٔ ۰٫۱ میلی‌متر، چگالی توانی حدود ۳۸ میلیون W/cm² دارد"],["مقایسه:","نور خورشید روی زمین حدود ۰٫۱ W/cm² است؛ لیزر صدها میلیون برابر متمرکزتر است"]]},{"t":"cards","title":"دو حالت کاری لیزر","cards":[{"h":"CW – Continuous Wave","p":"کانتینیوس ویو","b":"پیوسته: تابش بدون وقفه؛ رایج‌ترین حالت در برش"},{"h":"Pulsed","p":"پالسد","b":"ضربه‌ای: تابش به‌صورت پالس؛ مناسب پیرس ورق ضخیم و برش دقیق"}]},{"t":"summary","title":"خلاصه برای حفظ کردن","items":["طول موج فایبر ≈ ۱۰۷۰ nm (نامرئی، جذب خوب در فلز)","لیزر = پمپاژ + وارونی جمعیت + تابش القایی + کاواک","نور لیزر: تک‌رنگ، همدوس، موازی و شدید","مهم‌ترین عدد برش: چگالی توان"]},{"t":"quiz","title":"تمرین","qs":["تفاوت تابش خودبه‌خودی و القایی چیست؟","چرا بدون Population Inversion لیزر نداریم؟","اگر قطر لکه نصف شود، چگالی توان چند برابر می‌شود؟","چرا ۱۰۷۰ nm برای مس بهتر از CO₂ است؟"]},{"t":"qa","title":"پاسخ تمرین‌ها","qs":[["تفاوت خودبه‌خودی و القایی","خودبه‌خودی تصادفی است (نور لامپ)؛ القایی فوتونی هم‌جهت و هم‌فاز می‌سازد"],["چرا Population Inversion لازم است؟","بدون آن جذب بر تقویت غلبه می‌کند و نور تقویت نمی‌شود"],["قطر لکه نصف شود","مساحت یک‌چهارم می‌شود؛ پس چگالی توان ۴ برابر"],["۱۰۷۰ nm برای مس","مس در طول موج CO₂ بیش از ۹۸٪ بازتاب می‌دهد؛ در ۱۰۷۰ nm جذب چند برابر است"]]}]},{"short":"ساختار منبع لیزر فایبر","title":"درس ۲: ساختار منبع لیزر فایبر","slides":[{"t":"title","title":"درس ۲: ساختار منبع لیزر فایبر","sub":"از برق تا پرتو ۱۰۷۰ نانومتر"},{"t":"list","title":"مسیر نور در منبع لیزر","items":[["برق","← منبع تغذیه (Power Supply)"],["دیودهای پمپ","← تولید نور انرژی‌دهنده"],["کامبایْنر","← جمع کردن نور دیودها"],["فیبر ایتربیوم + FBG","← ساخت لیزر ۱۰۷۰ nm"],["کابل انتقال و QBH","← رساندن لیزر به سر برش"]]},{"t":"cards","title":"دیود پمپ و کامبایْنر","cards":[{"h":"Pump Diode","p":"پامپ دایُد = دیود پمپ","b":["قطعهٔ کوچکی که با برق، نور لیزری می‌سازد","طول موج معمول ۹۱۵ یا ۹۷۶ نانومتر","فقط انرژی می‌دهد؛ مستقیم برش نمی‌دهد","ده‌ها دیود در یک منبع کار می‌کنند"]},{"h":"Pump Combiner","p":"پامپ کامبایْنر = ترکیب‌کننده","b":["نور خیلی دیودها را در یک رشتهٔ نوری جمع می‌کند","مثل قیفی که چند لولهٔ آب را وارد یک لوله می‌کند","بدون آن، نور دیودها جدا از هم می‌ماند"]}]},{"t":"cards","title":"فیبر تقویت‌کننده: قلب منبع","cards":[{"h":"Gain Fiber","p":"گِین فایبر","b":"رشتهٔ شیشه‌ای بلند (ده‌ها متر) با ذرات ایتربیوم (Ytterbium – ایتِربیوم)؛ نور پمپ را به نور ۱۰۷۰ nm تبدیل می‌کند"},{"h":"Core","p":"کُر = هسته","b":"مرکز باریک فیبر؛ نور لیزر در آن ساخته می‌شود و ایتربیوم دارد"},{"h":"Cladding","p":"کلَدینگ = غلاف","b":"لایهٔ دور هسته؛ نور دیودها در آن جریان دارد و به هسته نفوذ می‌کند. به این ساختار Double-Clad (دابل کلَد) می‌گویند"}]},{"t":"cards","title":"FBG: آینه‌های داخل فیبر","intro":"Fiber Bragg Grating (فایبر براگ گِریتینگ): آینه‌ای که داخل خود فیبر ساخته شده","cards":[{"h":"HR – High Reflector","p":"اچ‌آر","b":"آینهٔ پشتی؛ تقریباً همهٔ نور را برمی‌گرداند"},{"h":"OC – Outp document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}});

// ---------- beam motif ----------
const beamSVG=`<svg class="beam" viewBox="0 0 1000 70" role="img" aria-label="مسیر پرتو لیزر از فیبر تا نقطهٔ کانونی" preserveAspectRatio="xMidYMid meet"><line x1="1000" y1="35" x2="780" y2="35"/><path class="fill" d="M780 33 L560 8 L560 62 L780 37Z"/><path d="M780 35 L560 8M780 35 L560 62"/><ellipse cx="560" cy="35" rx="9" ry="30"/><path class="fill" d="M560 8 L220 33 L220 37 L560 62Z"/><path d="M560 8 L220 35 L0 22M560 62 L220 35 L0 48"/><circle cx="220" cy="35" r="4.5"/></svg>`;

// ---------- rendering ----------
function bodyHTML(b){ if(!b) return ''; if(Array.isArray(b)) return '<ul>'+b.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'; return '<p>'+esc(b)+'</p>'; }
function cell(t,first){ t=String(t); return '<td'+(hasFa(t)?'':' dir="ltr"')+'>'+esc(t)+'</td>'; }
function slideHTML(s,id){
  const h2=s.title?'<h2>'+esc(s.title)+'</h2>':'';
  if(s.t==='cards'){
    return `<section class="blk" id="${id}">${h2}${s.intro?'<p class="intro">'+esc(s.intro)+'</p>':''}<div class="terms">`+s.cards.map(c=>`<article class="term${c.hl?' hl':''}">${c.h?`<h3><span${ltr(c.h)}>${esc(c.h)}</span>${c.p?`<span class="pr">${esc(c.p)}</span>`:''}</h3>`:''}${bodyHTML(c.b)}</article>`).join('')+'</div></section>';
  }
  if(s.t==='table'){
    return `<section class="blk" id="${id}">${h2}<div class="tablewrap"><table><thead><tr>${s.head.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')}</tr></thead><tbody>${s.rows.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('')}</tbody></table></div>${s.note?`<p class="note"${ltr(s.note)}>${esc(s.note)}</p>`:''}</section>`;
  }
  if(s.t==='list'||s.t==='formula'){
    const items=s.items.map(it=>Array.isArray(it)?`<li><span><b>${esc(it[0])}</b> ${esc(it[1])}</span></li>`:`<li><span>${esc(it)}</span></li>`).join('');
    const f=s.t==='formula'?`<div class="formula"><div class="eq">${esc(s.formula)}</div>${s.sub?`<div class="fa">${esc(s.sub)}</div>`:''}</div>`:'';
    return `<section class="blk" id="${id}">${h2}${f}<ol class="steps">${items}</ol></section>`;
  }
  if(s.t==='summary') return `<section class="blk" id="${id}">${h2}<div class="recap"><ol>${s.items.map(i=>'<li>'+esc(i)+'</li>').join('')}</ol></div></section>`;
  return '';
}
function practiceHTML(L_,id){
  const qz=L_.slides.find(s=>s.t==='quiz'), qa=L_.slides.find(s=>s.t==='qa'); if(!qz||!qa) return '';
  const qs=qz.qs.map((q,i)=>{const a=qa.qs[i]||['',''];return `<div class="q"><div class="qt">${fa(i+1)}) ${esc(q)}</div><button type="button" aria-expanded="false" data-ans="a${i}">نمایش پاسخ</button><div class="ans" id="a${i}" hidden><b>${esc(a[0])}:</b> ${esc(a[1])}</div></div>`}).join('');
  return `<section class="blk" id="${id}"><h2>تمرین و پاسخ</h2><p class="intro">اول خودتان جواب بدهید، بعد پاسخ را ببینید.</p>${qs}<button type="button" class="btn" id="allAns">نمایش همهٔ پاسخ‌ها</button></section>`;
}
function lessonView(n){
  const Ls=L[n-1]; const t=Ls.slides[0]; let secs='',i=0;
  Ls.slides.slice(1).forEach(s=>{ if(s.t==='quiz'||s.t==='qa') return; secs+=slideHTML(s,`s${++i}`); });
  secs+=practiceHTML(Ls,'practice');
  const isDone=done.has(n);
  const prev=n>1?`<a href="#/lesson/${n-1}">درس قبلی: ${esc(L[n-2].short)}</a>`:'<span></span>';
  const next=n<L.length?`<a href="#/lesson/${n+1}">درس بعدی: ${esc(L[n].short)}</a>`:`<a href="#/glossary">واژه‌نامه</a>`;
  main.innerHTML=`${beamSVG}<p class="eyebrow">هفتهٔ ${fa(n)} از ${fa(L.length)}</p><h1>${esc(Ls.short)}</h1><p class="sub">${esc(t.sub)}</p>${secs}<div class="pager">${prev}<button type="button" class="btn ${isDone?'':'solid'}" id="doneBtn">${isDone?'علامت «تمام شد» را بردار':'این درس را تمام کردم'}</button>${next}</div>`;
  main.querySelectorAll('button[data-ans]').forEach(b=>b.onclick=()=>{const a=document.getElementById(b.dataset.ans);const open=a.hidden;a.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'پنهان کردن پاسخ':'نمایش پاسخ'});
  const all=document.getElementById('allAns'); if(all) all.onclick=()=>{main.querySelectorAll('.ans').forEach(a=>a.hidden=false);main.querySelectorAll('button[data-ans]').forEach(b=>{b.setAttribute('aria-expanded','true');b.textContent='پنهان کردن پاسخ'})};
  document.getElementById('doneBtn').onclick=()=>{done.has(n)?done.delete(n):done.add(n);saveDone();lessonView(n);updateNav(n)};
  document.title=Ls.short+' | دورهٔ لیزر فایبر';
}
function homeView(){
  const next=L.findIndex((_,i)=>!done.has(i+1)); const cont=next<0?null:next+1;
  main.innerHTML=`${beamSVG}<p class="eyebrow">دورهٔ آموزشی آفلاین</p><h1>مهندسی لیزر فایبر فلزات</h1><p class="sub">از فیزیک نور تا انتخاب ماشین: هر درس اصطلاح انگلیسی، تلفظ فارسی، مثال و تمرین دارد.</p>
  ${cont?`<a class="btn solid" style="text-decoration:none;display:inline-block" href="#/lesson/${cont}">${done.size?'ادامهٔ دوره: ':'شروع دوره: '}${esc(L[cont-1].short)}</a>`:'<p><b>همهٔ درس‌ها را تمام کرده‌اید.</b> واژه‌نامه را مرور کنید.</p>'}
  <section class="blk"><h2>برنامهٔ هشت‌هفته‌ای</h2><ul class="lessons">${L.map((l,i)=>`<li class="${done.has(i+1)?'done':''}"><a href="#/lesson/${i+1}"><span class="tick" aria-hidden="true">✓</span><span class="wk">هفتهٔ ${fa(i+1)}</span><span>${esc(l.short)}</span></a></li>`).join('')}</ul></section>
  <section class="blk"><h2>برنامهٔ مطالعهٔ روزانه</h2><div class="plan"><div><b>۴۵ دقیقه</b>خواندن درس</div><div><b>۱۵ دقیقه</b>مرور اصطلاحات در واژه‌نامه</div><div><b>۱۵ دقیقه</b>تمرین و دیدن پاسخ</div><div><b>آخر هفته</b>مرور خلاصهٔ درس و آزمون کوتاه از خودتان</div></div></section>`;
  document.title='دورهٔ مهندسی لیزر فایبر فلزات';
}
// ---------- glossary ----------
function buildGlossary(){ const g=[],seen=new Set();
  L.forEach((l,li)=>l.slides.forEach(s=>{
    if(s.t==='table'&&s.head[0]==='اصطلاح'&&s.head[1]==='تلفظ') s.rows.forEach(r=>{const k=r[0].toLowerCase();if(!seen.has(k)){seen.add(k);g.push({en:r[0],pr:r[1],m:r.slice(2).join(' '),n:li+1})}});
    if(s.t==='cards') s.cards.forEach(c=>{ if(c.h&&c.p&&!hasFa(c.h)&&hasFa(c.p)){const k=c.h.toLowerCase();if(!seen.has(k)){seen.add(k);g.push({en:c.h,pr:c.p.split('=')[0].trim(),m:(Array.isArray(c.b)?c.b.join('؛ '):c.b)||'',n:li+1})}}});
  }));
  return g.sort((a,b)=>a.en.localeCompare(b.en)); }
const GL=buildGlossary();
function glossaryView(){
  main.innerHTML=`<h1>واژه‌نامه</h1><p class="sub">${fa(GL.length)} اصطلاح با تلفظ فارسی؛ روی شمارهٔ درس بزنید تا به توضیح کامل برسید.</p><label for="gf" class="eyebrow">فیلتر اصطلاحات</label><input class="filter" id="gf" type="search" placeholder="مثلاً: Nozzle یا نازل" autocomplete="off"><div class="tablewrap"><table><thead><tr><th scope="col">اصطلاح</th><th scope="col">تلفظ</th><th scope="col">معنی</th><th scope="col">درس</th></tr></thead><tbody id="gb"></tbody></table></div>`;
  const body=document.getElementById('gb');
  const draw=f=>{const q=f.trim().toLowerCase();body.innerHTML=GL.filter(r=>!q||(r.en+' '+r.pr+' '+r.m).toLowerCase().includes(q)).map(r=>`<tr><td dir="ltr">${esc(r.en)}</td><td>${esc(r.pr)}</td><td>${esc(r.m)}</td><td><a href="#/lesson/${r.n}" style="color:var(--accent)">${fa(r.n)}</a></td></tr>`).join('')||'<tr><td colspan="4">اصطلاحی پیدا نشد. عبارت کوتاه‌تری امتحان کنید.</td></tr>'};
  draw(''); document.getElementById('gf').oninput=e=>draw(e.target.value); document.title='واژه‌نامه | دورهٔ لیزر فایبر';
}
// ---------- search ----------
const INDEX=[]; L.forEach((l,li)=>{ let i=0; l.slides.slice(1).forEach(s=>{ if(s.t==='quiz'||s.t==='qa'){ if(s.t==='qa') INDEX.push({n:li+1,id:'practice',title:'تمرین و پاسخ',text:s.qs.map(r=>r.join(' ')).join(' ')}); return;} i++;
  let txt=[s.title,s.intro||'',s.note||'',s.formula||'',s.sub||''];
  if(s.cards) s.cards.forEach(c=>txt.push(c.h||'',c.p||'',Array.isArray(c.b)?c.b.join(' '):(c.b||'')));
  if(s.rows) txt.push(s.head.join(' '),...s.rows.map(r=>r.join(' ')));
  if(s.items) txt.push(...s.items.map(it=>Array.isArray(it)?it.join(' '):it));
  INDEX.push({n:li+1,id:'s'+i,title:s.title,text:txt.join(' ')}); }); });
function searchView(q){
  const k=q.trim().toLowerCase(); const hits=INDEX.filter(x=>(x.title+' '+x.text).toLowerCase().includes(k)).slice(0,40);
  main.innerHTML=`<h1>نتایج جست‌وجو</h1><p class="sub">${hits.length?fa(hits.length)+' نتیجه برای «'+esc(q)+'»':'نتیجه‌ای برای «'+esc(q)+'» پیدا نشد. املای انگلیسی یا عبارت کوتاه‌تر را امتحان کنید.'}</p><div class="results">${hits.map(h=>{const p=h.text.toLowerCase().indexOf(k);const sn=p<0?'':h.text.slice(Math.max(0,p-40),p+80);return `<a href="#/lesson/${h.n}/${h.id}"><b>درس ${fa(h.n)}: ${esc(h.title)}</b><small>${esc(sn)}</small></a>`}).join('')}</div>`;
}
// ---------- nav & routing ----------
const nav=document.getElementById('nav');
function updateNav(cur){
  nav.innerHTML=`<li><a href="#/home" ${cur==='home'?'aria-current="page"':''}>صفحهٔ اصلی</a></li>`+L.map((l,i)=>`<li class="${done.has(i+1)?'done':''}"><a href="#/lesson/${i+1}" ${cur===i+1?'aria-current="page"':''}><span class="tick" aria-hidden="true">✓</span>${fa(i+1)}. ${esc(l.short)}</a></li>`).join('')+`<li><a href="#/glossary" ${cur==='glossary'?'aria-current="page"':''}>واژه‌نامه</a></li>`;
  document.getElementById('meter').style.width=(done.size/L.length*100)+'%';
  document.getElementById('meterbar').setAttribute('aria-valuenow',done.size);
  document.getElementById('meterText').textContent=fa(done.size)+' از '+fa(L.length)+' درس تمام شده';
}
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/'); document.body.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');
  let cur='home';
  if(h[0]==='lesson'&&L[+h[1]-1]){cur=+h[1];lessonView(cur);if(h[2]){const el=document.getElementById(h[2]);if(el){el.scrollIntoView();return updateNav(cur)}}}
  else if(h[0]==='glossary'){cur='glossary';glossaryView()}
  else homeView();
  updateNav(cur); window.scrollTo(0,0);
}
let qt; document.getElementById('q').addEventListener('input',e=>{clearTimeout(qt);const v=e.target.value;qt=setTimeout(()=>{ if(v.trim().length>=2){searchView(v);document.body.classList.remove('open');window.scrollTo(0,0)} else if(!v.trim()) route(); },180)});
addEventListener('hashchange',()=>{document.getElementById('q').value='';route()});
route();
})();
</script>
</body>
</html>
